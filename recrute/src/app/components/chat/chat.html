<div class="chat-panel" [class.full-height]="fullHeight">
  <div class="chat-header">
    <span class="chat-with">💬 {{ otherName }}</span>
  </div>

  <div class="chat-messages">
    <div *ngIf="messages.length === 0" class="chat-empty">
      Aucun message pour le moment. Envoyez le premier message !
    </div>

    <div
      *ngFor="let msg of messages"
      class="chat-bubble"
      [class.mine]="isMine(msg)"
      [class.theirs]="!isMine(msg)"
    >
      <div class="bubble-body">{{ msg.body }}</div>
      <div class="bubble-time">{{ formatTime(msg.createdAt) }}</div>
    </div>

    <div #bottom></div>
  </div>

  <div class="chat-input-row">
    <textarea
      class="chat-input"
      [(ngModel)]="draft"
      (keydown)="onKey($event)"
      placeholder="Votre message… (Entrée pour envoyer)"
      rows="2"
    ></textarea>
    <button class="chat-send" (click)="send()" [disabled]="!draft.trim() || sending">
      {{ sending ? '…' : '→' }}
    </button>
  </div>
</div>
